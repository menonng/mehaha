name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - claude/github-page-prank-a760o7
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Assemble Pages artifact
        run: |
          mkdir -p site
          cp index.html style.css site/
          cp -r dist site/dist
          # 캐시 무효화: 매 배포마다 커밋 SHA를 쿼리스트링으로 붙여서
          # 브라우저/CDN이 이전 빌드의 main.js·style.css를 재사용하지 않게 한다.
          SHORT_SHA="${GITHUB_SHA::8}"
          sed -i "s/dist\/main\.js\"/dist\/main.js?v=${SHORT_SHA}\"/" site/index.html
          sed -i "s/style\.css\"/style.css?v=${SHORT_SHA}\"/" site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
